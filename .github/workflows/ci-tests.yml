name: PLFM RADAR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simulation-tests:
    name: Run Python Simulations
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas matplotlib

    - name: Run DAC Reconstruction Simulation
      run: |
        # Run the chirp generation script headless
        python 5_Simulations/DAC_ReconstructionFilter/Generate_ChirpcsvFile.py

    - name: Verify Output
      run: |
        if [ -f "multi_ramp_stairs.csv" ]; then
          echo "Simulation output successfully generated."
        else
          echo "Output file missing!"
          exit 1
        fi
